<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="grass" x2="0" y2="1"><stop stop-color="#aab77b"/><stop offset="1" stop-color="#738252"/></linearGradient>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fff3df"/><stop offset="1" stop-color="#f2dfc5"/></linearGradient>
    <pattern id="speckle" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="5" cy="8" r="1.5" fill="#bea984" opacity=".28"/><circle cx="20" cy="19" r="1.7" fill="#d3bd98" opacity=".25"/></pattern>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="135%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#182016" flood-opacity=".4"/></filter>
    <style>
      .ui{font-family:Arial,sans-serif;fill:#493d30}.small{font-size:17px}.medium{font-size:20px}.title{font-size:24px;fill:#fff}
      .head{fill:#81251f}.paper{fill:url(#paper);stroke:#a88662;stroke-width:2}.btn{fill:#dfc196;stroke:#987750;stroke-width:1.5}.btnText{font:18px Arial,sans-serif;fill:#473a2c;text-anchor:middle;dominant-baseline:middle}
      .field{fill:#fff7e9;stroke:#bc9c76;stroke-width:1.5}.rule{stroke:#c3a17a;stroke-width:1.5}.row{fill:#fff7e9;stroke:#dbbf98;stroke-width:1.3}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#343831"/>
  <text x="42" y="48" class="ui medium" fill="#f4e5ce">STAGE 10b — SELECTED OPTION A, WIDE SITES LIST</text>
  <text x="42" y="76" class="ui small" fill="#d7ccb9">Project actions stay inline; every Site row control fits on one line.</text>

  <!-- Game view -->
  <rect x="28" y="102" width="1544" height="866" rx="14" fill="url(#grass)"/>
  <path d="M28 625 Q330 560 635 630 T1200 600 T1572 650 L1572 968 L28 968Z" fill="#66754d" opacity=".33"/>
  <path d="M10 760 Q420 690 880 800 T1600 755" fill="none" stroke="#bbb299" stroke-width="72" opacity=".62"/>
  <path d="M10 760 Q420 690 880 800 T1600 755" fill="none" stroke="#8a8570" stroke-width="5" stroke-dasharray="28 18" opacity=".8"/>
  <rect x="48" y="120" width="1490" height="44" rx="5" fill="#f6f3e9" opacity=".96"/>
  <text x="70" y="149" class="ui medium">₽ 9,974,989</text><text x="345" y="149" class="ui medium">6 January 1970</text><text x="1324" y="149" class="ui medium">▶  8 m/s</text>
  <text x="64" y="205" class="ui small" fill="#fff7e4">Selected Site on the terrain</text>

  <!-- Site footprint -->
  <polygon points="355,397 526,366 567,466 389,503" fill="#14c9c1" fill-opacity=".22" stroke="#11d4ce" stroke-width="5"/>
  <path d="M355 397L526 366L567 466L389 503Z M374 403L541 374 M367 427L550 398 M376 451L558 422 M384 477L565 448" fill="none" stroke="#d8fff9" stroke-width="2"/>
  <circle cx="461" cy="435" r="6" fill="#fff"/>
  <text x="348" y="532" class="ui small" fill="#fff8e9">Click the outline to reopen its editor</text>

  <!-- World-space site editor beside footprint -->
  <g filter="url(#shadow)">
    <rect x="75" y="350" width="252" height="226" rx="11" class="paper"/>
    <rect x="75" y="350" width="252" height="42" rx="11" class="head"/><rect x="75" y="378" width="252" height="14" class="head"/>
    <text x="92" y="379" class="title" font-size="21">Site editor</text><text x="285" y="379" class="title">×</text>
    <text x="92" y="425" class="ui small">Name</text>
    <rect x="145" y="403" width="123" height="32" rx="4" class="field"/><text x="155" y="425" class="ui small">Site-1</text>
    <rect x="274" y="403" width="42" height="32" rx="4" class="btn"/><text x="295" y="419" class="btnText">✓</text>
    <text x="92" y="468" class="ui small">Target height</text><rect x="205" y="446" width="111" height="32" rx="4" class="field"/><text x="216" y="468" class="ui small">12.50 m</text>
    <text x="92" y="513" class="ui small">Footprint  32 × 18 m</text>
    <text x="92" y="544" class="ui small">Cut 0 m³   Fill 67 m³</text>
  </g>
  <path d="M327 440 Q339 436 355 425" fill="none" stroke="#fff2d7" stroke-width="3" stroke-dasharray="7 6"/>

  <!-- Wide parchment Sites panel -->
  <g filter="url(#shadow)">
    <rect x="680" y="190" width="864" height="700" rx="13" class="paper"/>
    <rect x="680" y="190" width="864" height="50" rx="13" class="head"/><rect x="680" y="225" width="864" height="15" class="head"/>
    <text x="704" y="224" class="title">Earthworks | Sites</text><text x="1474" y="224" class="title">−  ×</text>
    <text x="704" y="272" class="ui small">Project</text>
    <rect x="774" y="251" width="235" height="40" rx="5" class="field"/><text x="789" y="277" class="ui medium">Project 1  ▾</text>
    <rect x="1020" y="251" width="116" height="40" rx="5" class="btn"/><text x="1078" y="271" class="btnText">＋ New</text>
    <rect x="1145" y="251" width="132" height="40" rx="5" class="btn"/><text x="1211" y="271" class="btnText">Rename</text>
    <rect x="1286" y="251" width="125" height="40" rx="5" class="btn"/><text x="1348" y="271" class="btnText">Delete</text>
    <text x="704" y="324" class="ui small">Facilities: 1 assigned</text><rect x="865" y="300" width="126" height="38" rx="5" class="btn"/><text x="928" y="319" class="btnText">Manage</text>
    <line x1="704" y1="352" x2="1519" y2="352" class="rule"/>
    <text x="704" y="382" class="ui medium">Sites in Project 1</text>
    <rect x="704" y="398" width="815" height="32" fill="#ead6b8" stroke="#c3a17a" stroke-width="1.4"/>
    <text x="719" y="421" class="ui small">Site</text><text x="899" y="421" class="ui small">Progress</text><text x="1003" y="421" class="ui small">Priority</text><text x="1135" y="421" class="ui small">Work</text><text x="1278" y="421" class="ui small">Cancel</text><text x="1413" y="421" class="ui small">View</text>

    <!-- Site row 1: controls on one horizontal line -->
    <rect x="704" y="432" width="815" height="63" rx="4" class="row"/>
    <text x="719" y="459" class="ui medium">Site-1</text><text x="719" y="482" class="ui small">Queued</text>
    <text x="902" y="471" class="ui small">0%</text><rect x="929" y="452" width="56" height="16" rx="7" fill="#d9c6a7"/><rect x="929" y="452" width="4" height="16" rx="7" fill="#79a77b"/>
    <rect x="1001" y="448" width="34" height="34" rx="4" class="btn"/><text x="1018" y="465" class="btnText">↑</text><rect x="1040" y="448" width="34" height="34" rx="4" class="btn"/><text x="1057" y="465" class="btnText">↓</text>
    <rect x="1100" y="448" width="116" height="34" rx="4" class="btn"/><text x="1158" y="465" class="btnText">Start</text>
    <rect x="1235" y="448" width="112" height="34" rx="4" class="btn"/><text x="1291" y="465" class="btnText">Cancel</text>
    <rect x="1372" y="448" width="118" height="34" rx="4" fill="#e6d8c0" stroke="#bca989" stroke-width="1.5"/><text x="1431" y="465" class="btnText" fill="#827866">View</text>

    <!-- Site row 2: controls on one horizontal line -->
    <rect x="704" y="503" width="815" height="63" rx="4" class="row"/>
    <text x="719" y="530" class="ui medium">Site-2</text><text x="719" y="553" class="ui small">Paused</text>
    <text x="902" y="542" class="ui small">23%</text><rect x="929" y="523" width="56" height="16" rx="7" fill="#d9c6a7"/><rect x="929" y="523" width="17" height="16" rx="7" fill="#79a77b"/>
    <rect x="1001" y="519" width="34" height="34" rx="4" class="btn"/><text x="1018" y="536" class="btnText">↑</text><rect x="1040" y="519" width="34" height="34" rx="4" class="btn"/><text x="1057" y="536" class="btnText">↓</text>
    <rect x="1100" y="519" width="116" height="34" rx="4" class="btn"/><text x="1158" y="536" class="btnText">Resume</text>
    <rect x="1235" y="519" width="112" height="34" rx="4" class="btn"/><text x="1291" y="536" class="btnText">Cancel</text>
    <rect x="1372" y="519" width="118" height="34" rx="4" fill="#e6d8c0" stroke="#bca989" stroke-width="1.5"/><text x="1431" y="536" class="btnText" fill="#827866">View</text>

    <line x1="704" y1="590" x2="1519" y2="590" class="rule"/>
    <rect x="704" y="610" width="815" height="50" rx="6" class="btn"/><text x="1111" y="635" class="btnText">＋  New Site</text>
    <rect x="704" y="674" width="815" height="42" rx="5" class="field"/><text x="1111" y="695" class="btnText">Remove completed (0)</text>
    <text x="704" y="759" class="ui small" fill="#6e6251">One Project contains multiple Sites; the selector filters the list.</text>
    <text x="704" y="785" class="ui small" fill="#6e6251">The disabled View control stays inert until camera centering is fixed.</text>
  </g>
</svg>
