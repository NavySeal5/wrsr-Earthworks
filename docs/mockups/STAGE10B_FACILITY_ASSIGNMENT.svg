<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <defs>
    <linearGradient id="grass" x2="0" y2="1"><stop stop-color="#aab77b"/><stop offset="1" stop-color="#738252"/></linearGradient>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fff3df"/><stop offset="1" stop-color="#f2dfc5"/></linearGradient>
    <pattern id="speckle" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="5" cy="8" r="1.5" fill="#bea984" opacity=".28"/><circle cx="20" cy="19" r="1.7" fill="#d3bd98" opacity=".25"/></pattern>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="135%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#182016" flood-opacity=".42"/></filter>
    <style>
      .ui{font-family:Arial,sans-serif;fill:#493d30}.small{font-size:17px}.medium{font-size:20px}.title{font-size:24px;fill:#fff}
      .head{fill:#81251f}.paper{fill:url(#paper);stroke:#a88662;stroke-width:2}.btn{fill:#dfc196;stroke:#987750;stroke-width:1.5}.btnText{font:18px Arial,sans-serif;fill:#473a2c;text-anchor:middle;dominant-baseline:middle}
      .field{fill:#fff7e9;stroke:#bc9c76;stroke-width:1.5}.rule{stroke:#c3a17a;stroke-width:1.5}.row{fill:#fff7e9;stroke:#dbbf98;stroke-width:1.3}.disabled{fill:#eadfcd;stroke:#c6b89f;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1600" height="950" fill="#343831"/>
  <text x="42" y="48" class="ui medium" fill="#f4e5ce">STAGE 10b — PROJECT FACILITY ASSIGNMENT MOCKUP</text>
  <text x="42" y="76" class="ui small" fill="#d7ccb9">A Project's facility pool serves all Sites in that Project; each facility can belong to only one Project.</text>

  <!-- Game background -->
  <rect x="28" y="102" width="1544" height="816" rx="14" fill="url(#grass)"/>
  <path d="M28 625 Q330 560 635 630 T1200 600 T1572 650 L1572 918 L28 918Z" fill="#66754d" opacity=".33"/>
  <path d="M10 760 Q420 690 880 800 T1600 755" fill="none" stroke="#bbb299" stroke-width="72" opacity=".62"/>
  <path d="M10 760 Q420 690 880 800 T1600 755" fill="none" stroke="#8a8570" stroke-width="5" stroke-dasharray="28 18" opacity=".8"/>
  <rect x="48" y="120" width="1490" height="44" rx="5" fill="#f6f3e9" opacity=".96"/>
  <text x="70" y="149" class="ui medium">₽ 9,974,989</text><text x="345" y="149" class="ui medium">6 January 1970</text><text x="1324" y="149" class="ui medium">▶  8 m/s</text>

  <!-- Sites window in background -->
  <g opacity=".86">
    <rect x="1010" y="194" width="530" height="665" rx="12" class="paper"/>
    <rect x="1010" y="194" width="530" height="49" rx="12" class="head"/><rect x="1010" y="227" width="530" height="16" class="head"/>
    <text x="1033" y="228" class="title">Earthworks | Sites</text><text x="1480" y="228" class="title">− ×</text>
    <text x="1034" y="278" class="ui small">Project</text><rect x="1104" y="255" width="190" height="40" rx="5" class="field"/><text x="1118" y="281" class="ui medium">Project 1 ▾</text>
    <text x="1034" y="333" class="ui small">Facilities: 1 assigned</text><rect x="1194" y="308" width="118" height="38" rx="5" class="btn"/><text x="1253" y="327" class="btnText">Manage</text>
    <line x1="1034" y1="364" x2="1514" y2="364" class="rule"/><text x="1034" y="394" class="ui medium">Sites in Project 1</text>
    <rect x="1034" y="412" width="480" height="61" rx="4" class="row"/><text x="1048" y="440" class="ui medium">Site-1</text><text x="1048" y="461" class="ui small">Queued</text>
    <rect x="1034" y="482" width="480" height="61" rx="4" class="row"/><text x="1048" y="510" class="ui medium">Site-2</text><text x="1048" y="531" class="ui small">Running</text>
    <rect x="1034" y="570" width="480" height="47" rx="5" class="btn"/><text x="1274" y="593" class="btnText">＋  New Site</text>
  </g>

  <!-- Map site and selected facility marker -->
  <polygon points="210,469 360,440 397,524 239,556" fill="#14c9c1" fill-opacity=".21" stroke="#11d4ce" stroke-width="4"/>
  <path d="M210 469L360 440L397 524L239 556Z M228 475L374 448 M224 499L384 472 M232 525L393 498" fill="none" stroke="#d8fff9" stroke-width="2"/>
  <text x="207" y="585" class="ui small" fill="#fff8e9">Site in Project 1</text>
  <rect x="122" y="695" width="154" height="93" rx="8" fill="#8f9277" stroke="#ede0c6" stroke-width="3"/>
  <rect x="143" y="671" width="113" height="46" rx="3" fill="#d0c4a8" stroke="#756c59" stroke-width="2"/>
  <text x="116" y="824" class="ui small" fill="#fff8e9">Earthworks facility on map</text>

  <!-- Facility manager -->
  <g filter="url(#shadow)">
    <rect x="321" y="224" width="646" height="612" rx="13" class="paper"/>
    <rect x="321" y="224" width="646" height="50" rx="13" class="head"/><rect x="321" y="259" width="646" height="15" class="head"/>
    <text x="345" y="258" class="title">Facilities | Project 1</text><text x="912" y="258" class="title">×</text>
    <text x="345" y="310" class="ui small">Assigned facilities contribute capacity to every Site in this Project.</text>
    <text x="345" y="335" class="ui small">A facility can be assigned to one Project at a time.</text>
    <line x1="345" y1="354" x2="944" y2="354" class="rule"/>
    <text x="345" y="385" class="ui medium">Assigned to Project 1</text>
    <rect x="345" y="400" width="599" height="64" rx="5" class="row"/>
    <rect x="361" y="415" width="34" height="34" rx="4" fill="#8ab47d" stroke="#719466" stroke-width="1.5"/><text x="378" y="432" class="btnText">✓</text>
    <text x="410" y="426" class="ui medium">Earthworks Development Facility — #14</text><text x="410" y="450" class="ui small">Assigned to this Project</text>
    <rect x="817" y="414" width="110" height="36" rx="4" class="btn"/><text x="872" y="432" class="btnText">Remove</text>
    <line x1="345" y1="481" x2="944" y2="481" class="rule"/>
    <text x="345" y="512" class="ui medium">Add another facility</text>
    <rect x="345" y="527" width="599" height="48" rx="5" class="field"/>
    <text x="362" y="557" class="ui small">Find an Earthworks facility near a map click…</text>
    <rect x="791" y="534" width="136" height="34" rx="4" class="btn"/><text x="859" y="551" class="btnText">Choose on map</text>
    <text x="345" y="606" class="ui small" fill="#6e6251">Available facilities found nearby</text>
    <rect x="345" y="617" width="599" height="58" rx="5" class="row"/>
    <text x="362" y="643" class="ui medium">Earthworks Development Facility — #18</text><text x="362" y="663" class="ui small">520 m away</text>
    <rect x="817" y="628" width="110" height="36" rx="4" class="btn"/><text x="872" y="646" class="btnText">＋ Add</text>
    <rect x="345" y="683" width="599" height="58" rx="5" class="disabled"/>
    <text x="362" y="709" class="ui medium" fill="#756c5e">Earthworks Development Facility — #23</text><text x="362" y="729" class="ui small" fill="#756c5e">Already assigned to Project 2</text>
    <rect x="817" y="694" width="110" height="36" rx="4" class="disabled"/><text x="872" y="712" class="btnText" fill="#827866">Unavailable</text>
    <line x1="345" y1="758" x2="944" y2="758" class="rule"/>
    <text x="345" y="784" class="ui small" fill="#6e6251">Distance is informational; it does not set operating coverage.</text>
    <rect x="816" y="790" width="128" height="34" rx="4" class="btn"/><text x="880" y="807" class="btnText">Done</text>
  </g>
</svg>
