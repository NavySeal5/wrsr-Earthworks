      <text x="718" y="402" class="ui small">0%</text><rect x="624" y="414" width="82" height="27" rx="4" class="btn"/><text x="665" y="428" class="btntext">Start</text><rect x="713" y="414" width="82" height="27" rx="4" class="btn"/><text x="754" y="428" class="btntext">Cancel</text>
      <rect x="488" y="456" width="316" height="78" rx="4" class="row"/><text x="500" y="482" class="ui mid">Site-2</text><text x="500" y="511" class="ui small">Paused</text>
      <rect x="624" y="469" width="40" height="28" rx="4" class="btn"/><text x="644" y="483" class="btntext">↑</text><rect x="670" y="469" width="40" height="28" rx="4" class="btn"/><text x="690" y="483" class="btntext">↓</text>
      <text x="718" y="488" class="ui small">23%</text><rect x="624" y="500" width="82" height="27" rx="4" class="btn"/><text x="665" y="514" class="btntext">Resume</text><rect x="713" y="500" width="82" height="27" rx="4" class="btn"/><text x="754" y="514" class="btntext">Cancel</text>
