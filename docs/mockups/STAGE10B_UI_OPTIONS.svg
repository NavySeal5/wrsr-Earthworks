<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
  <defs>
    <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#a7b374"/><stop offset="1" stop-color="#788455"/></linearGradient>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fff3df"/><stop offset="1" stop-color="#f4dfc3"/></linearGradient>
    <pattern id="grain" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="5" cy="9" r="2" fill="#d4c09d" opacity=".25"/><circle cx="25" cy="24" r="1.7" fill="#bda984" opacity=".23"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#182016" flood-opacity=".42"/></filter>
    <style>
      .ui{font-family:Arial,sans-serif;fill:#473a2c}.small{font-size:17px}.mid{font-size:20px}.large{font-size:24px}.title{font-size:24px;fill:#fff}
      .btn{fill:#ddbd91;stroke:#9a7654;stroke-width:2}.btntext{font-family:Arial,sans-serif;font-size:18px;fill:#473a2c;text-anchor:middle;dominant-baseline:middle}
      .row{fill:#fff4e6;stroke:#d4b68e;stroke-width:1.5}.muted{fill:#736653}.head{fill:#81251f}.line{stroke:#b7946c;stroke-width:1}
    </style>
  </defs>
  <rect width="1800" height="1180" fill="#3f4038"/>
  <text x="50" y="52" class="ui large" fill="#f4e5ce">STAGE 10b — UI MOCKUP OPTIONS</text>
  <text x="50" y="82" class="ui small" fill="#cfc5b2">Both follow the parchment panel style and keep the Earthwork editor beside its selected site.</text>

  <!-- Shared game scene backgrounds -->
  <g transform="translate(35 115)">
    <rect width="850" height="1010" rx="15" fill="url(#ground)"/>
    <path d="M0 690 Q200 620 380 680 T850 635 L850 1010 L0 1010Z" fill="#65734d" opacity=".35"/>
    <path d="M-20 765 Q310 690 870 820" fill="none" stroke="#b4aa8e" stroke-width="62" opacity=".68"/>
    <path d="M-20 765 Q310 690 870 820" fill="none" stroke="#8e8974" stroke-width="5" stroke-dasharray="28 16" opacity=".8"/>
    <rect x="22" y="15" width="806" height="48" rx="5" fill="#f7f4e9" opacity=".94"/>
    <text x="44" y="47" class="ui mid">₽ 9,974,989</text><text x="270" y="47" class="ui mid">6 January 1970</text><text x="641" y="47" class="ui mid">▶  8 m/s</text>
    <text x="38" y="108" class="ui small" fill="#fff4df">A — Inline project controls</text>
    <!-- Selected earthwork on map -->
    <polygon points="245,434 448,395 497,504 289,548" fill="#16c9c0" fill-opacity=".20" stroke="#16d9cf" stroke-width="5"/>
    <path d="M245 434L448 395L497 504L289 548Z M270 442L462 407 M260 466L472 431 M270 491L483 456 M281 516L493 480" fill="none" stroke="#d1fff9" stroke-width="2" opacity=".92"/>
    <circle cx="365" cy="465" r="7" fill="#fff"/>
    <text x="225" y="578" class="ui small" fill="#fff8e8">Selected site — click to reopen editor</text>
    <!-- Option A panel -->
    <g filter="url(#shadow)">
      <rect x="470" y="112" width="352" height="690" rx="12" fill="url(#paper)" stroke="#b89169" stroke-width="2"/>
      <rect x="470" y="112" width="352" height="48" rx="12" class="head"/>
      <rect x="470" y="145" width="352" height="15" class="head"/>
      <text x="488" y="144" class="title">Earthworks | Sites</text><text x="773" y="143" class="title">−  ×</text>
      <text x="488" y="190" class="ui small">Selected project</text>
      <rect x="488" y="202" width="172" height="40" rx="5" class="row"/><text x="500" y="228" class="ui mid">Project 1  ▾</text>
