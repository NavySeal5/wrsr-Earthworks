      <rect x="64" y="298" width="410" height="368" rx="12" fill="url(#paper)" stroke="#9a7654" stroke-width="3"/>
      <rect x="64" y="298" width="410" height="48" rx="12" class="head"/><rect x="64" y="331" width="410" height="15" class="head"/>
      <text x="84" y="330" class="title">Manage Projects</text><text x="432" y="330" class="title">×</text>
      <text x="86" y="384" class="ui small">Republic Projects</text>
      <rect x="84" y="398" width="370" height="52" rx="5" fill="#e7cda9" stroke="#9a7654" stroke-width="2"/>
