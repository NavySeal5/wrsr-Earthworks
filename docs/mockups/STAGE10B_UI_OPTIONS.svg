      <text x="73" y="427" class="ui small">Target height</text><rect x="183" y="407" width="105" height="30" rx="4" class="row"/><text x="194" y="428" class="ui small">12.50 m</text>
      <text x="73" y="463" class="ui small">Footprint  32 × 18 m</text><text x="73" y="488" class="ui small">Cut 0 m³   Fill 67 m³</text>
    </g>
    <path d="M305 410 Q333 397 350 431" fill="none" stroke="#fff2d5" stroke-width="3" stroke-dasharray="7 6"/>
  </g>

