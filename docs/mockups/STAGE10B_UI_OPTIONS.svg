      <text x="488" y="359" class="ui small muted">Site                           Progress       Work</text>
      <rect x="488" y="370" width="316" height="78" rx="4" class="row"/>
      <text x="500" y="396" class="ui mid">Site-1</text><text x="500" y="425" class="ui small">Queued</text>
      <rect x="624" y="383" width="40" height="28" rx="4" class="btn"/><text x="644" y="397" class="btntext">↑</text>
      <rect x="670" y="383" width="40" height="28" rx="4" class="btn"/><text x="690" y="397" class="btntext">↓</text>
      <text x="718" y="402" class="ui small">0%</text><rect x="624" y="414" width="82" height="27" rx="4" class="btn"/><text x="665" y="428" class="btntext">Start</text>
      <rect x="713" y="414" width="82" height="27" rx="4" class="btn"/><text x="754" y="428" class="btntext">Cancel</text>
      <rect x="488" y="456" width="316" height="78" rx="4" class="row"/>
      <text x="500" y="482" class="ui mid">Site-2</text><text x="500" y="511" class="ui small">Paused</text>
      <rect x="624" y="469" width="40" height="28" rx="4" class="btn"/><text x="644" y="483" class="btntext">↑</text>
      <rect x="670" y="469" width="40" height="28" rx="4" class="btn"/><text x="690" y="483" class="btntext">↓</text>
      <text x="718" y="488" class="ui small">23%</text><rect x="624" y="500" width="82" height="27" rx="4" class="btn"/><text x="665" y="514" class="btntext">Resume</text>
      <rect x="713" y="500" width="82" height="27" rx="4" class="btn"/><text x="754" y="514" class="btntext">Cancel</text>
      <line x1="488" y1="550" x2="804" y2="550" class="line"/>
      <rect x="488" y="568" width="316" height="48" rx="6" class="btn"/><text x="646" y="592" class="btntext">＋  New Earthwork</text>
      <rect x="488" y="625" width="316" height="39" rx="5" class="row"/><text x="646" y="645" class="btntext">Remove completed (0)</text>
      <text x="488" y="700" class="ui small muted">Project controls stay beside the selector.</text>
      <text x="488" y="726" class="ui small muted">The list shows sites from this project only.</text>
    </g>
    <!-- Floating editor A -->
    <g filter="url(#shadow)">
      <rect x="58" y="318" width="247" height="183" rx="10" fill="url(#paper)" stroke="#b89169" stroke-width="2"/>
      <rect x="58" y="318" width="247" height="40" rx="10" class="head"/><rect x="58" y="345" width="247" height="13" class="head"/>
